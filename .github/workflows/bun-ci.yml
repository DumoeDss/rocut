name: Bun CI

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
      BETTER_AUTH_SECRET: "supersecret"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      UPSTASH_REDIS_REST_URL: "https://your-upstash-redis-url"
      UPSTASH_REDIS_REST_TOKEN: "your-upstash-redis-token"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
      MARBLE_WORKSPACE_KEY: "placeholder"
      FREESOUND_CLIENT_ID: "placeholder"
      FREESOUND_API_KEY: "placeholder"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # `rustup toolchain install` with no argument is what reads `rust-toolchain.toml`; a bare
      # `rustup target add` installs the target against the runner image's default rustc instead,
      # which is how PR #2 built with an unpinned compiler and reported wasm-export deltas no
      # commit had caused. The pinned channel embeds itself in the binary's `producers` section and
      # in three rustc symbol-hash exports, so it is part of the recorded surface, not a preference.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version

      # Pinned, not `latest`: wasm-pack selects the wasm-bindgen CLI that writes all four glue
      # files and the wasm-opt build that rewrites the binary. `latest` installed v0.15.0 on the
      # PR #2 merge run against a surface recorded with 0.13.1. `script/check-wasm-source.mjs`
      # asserts this literal matches `WASM_PACK_VERSION` in `script/wasm-toolchain.mjs`.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      # Routed through the script rather than calling wasm-pack directly, so CI
      # builds the artifact the same way `bun run build:wasm` does. The script
      # applies `--remap-path-prefix`, which keeps the runner's absolute paths out
      # of a binary that is now redistributed. Calling wasm-pack here directly
      # would silently produce a differently-provenanced artifact from the local one.
      - name: Build WASM
        run: node script/build-wasm.mjs

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.2.18-${{ hashFiles('apps/web/bun.lock') }}

      - name: Install dependencies
        working-directory: apps/web
        run: bun install

      # MUST stay after "Install dependencies": it asserts what the install
      # actually RESOLVED, not what the manifests declare. A stale or registry
      # copy of `opencut-wasm` passes every other gate in this workflow — the
      # type baseline, both Host builds and the parity fixture all succeed
      # against the wrong artifact — so this is the only step that can catch it.
      - name: Verify the resolved wasm is the self-built artifact
        run: node script/check-wasm-source.mjs

      # An unremapped artifact is behaviourally perfect — it passes the type
      # baseline, both Host builds, the parity fixture and the check above. This
      # is the only step that can tell the difference, so without it the single
      # remapping build path is convention rather than enforcement.
      - name: Verify the redistributed wasm discloses no build-machine paths
        run: node script/check-wasm-paths.mjs

      - name: Verify the exact additive wasm API surface
        run: node script/check-wasm-api-surface.mjs

      # Every gate above is static — bytes, paths, export counts. All three were green through the
      # whole S05 portfolio while the artifact could not be *initialized* at all outside a bundler
      # (`TypeError: wasm.__wbindgen_start is not a function`). This step runs it: both runtimes,
      # plus classic's real 31-step migration chain with no test mock anywhere in the process.
      - name: Verify the redistributed wasm actually initializes
        run: node script/check-wasm-init.mjs
        env:
          OPENCUT_BUN: bun

      - name: Build
        working-directory: apps/web
        run: bun run build

      - name: Run tests
        working-directory: apps/web
        run: echo "No tests implemented yet"
        continue-on-error: true

  # Claims exactly what run-published-examples.mjs runs: the four
  # published-SDK examples (install-packages, agent-transaction,
  # custom-storage's two migration legs, embed-surface's build + GPU-free
  # Playwright smoke) plus the consumer view over the freshly packed tarballs —
  # the Group-5 clean full-run log
  # (rasen/changes/s05-published-examples/evidence/logs/group5-full-run-clean.log)
  # is this job's local twin, same env shape (scratch under $HOME). Since the
  # wasm-init repair (BOUNDARIES §17) custom-storage's PRODUCTION leg loads the
  # real 31-step chain from the installed tarballs and exercises migration; it
  # used to record that failure and skip that leg. Does NOT
  # claim: the local-only checkers stay local (the checker family sweep is a
  # local gate), no matrix extension beyond ubuntu, no publish. The first
  # true CI execution lands on the post-delivery push — the local twin above
  # is the pre-delivery evidence; stated, not hidden.
  sdk-examples:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # `rustup toolchain install` with no argument is what reads `rust-toolchain.toml`; a bare
      # `rustup target add` installs the target against the runner image's default rustc instead,
      # which is how PR #2 built with an unpinned compiler and reported wasm-export deltas no
      # commit had caused. The pinned channel embeds itself in the binary's `producers` section and
      # in three rustc symbol-hash exports, so it is part of the recorded surface, not a preference.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version

      # Pinned, not `latest`: wasm-pack selects the wasm-bindgen CLI that writes all four glue
      # files and the wasm-opt build that rewrites the binary. `latest` installed v0.15.0 on the
      # PR #2 merge run against a surface recorded with 0.13.1. `script/check-wasm-source.mjs`
      # asserts this literal matches `WASM_PACK_VERSION` in `script/wasm-toolchain.mjs`.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      # Same routed build as the build job: the examples' tarballs pack the
      # self-built, remapped wasm, and a registry copy would pass the
      # typecheck legs while silently testing the wrong artifact.
      - name: Build WASM
        run: node script/build-wasm.mjs

      # Scratch root under $HOME — the runner's own controls refuse repo-tree,
      # Temp (runner.temp) and any root below an ancestor carrying node_modules
      # (CONTROL-1a/1b/1c) by design: upward module resolution from a leaky
      # chain can satisfy imports the scratch tree never installed, which is
      # how a local default-root build once borrowed a dependency the tarballs
      # never shipped (the date-fns leak of 2026-08-15). OPENCUT_BUN stays at
      # its default (npx --yes bun@1.2.18). embed-surface's smoke installs its
      # own headless chromium on first run (the smoke's self-install
      # fallback); the hosted ubuntu image ships the browser dependencies.
      - name: Run the published-examples runner
        run:
          OPENCUT_SCRATCH_ROOT="$HOME/.opencut-scratch-ci" node script/run-published-examples.mjs
