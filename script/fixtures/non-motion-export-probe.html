<!doctype html>
<meta charset="utf-8" />
<script type="module">
	import {
		disposeCompositor,
		disposeGpu,
		initializeGpu,
	} from "/rust/wasm/pkg/opencut_wasm.js";
	import { buildGraphicElement } from "/packages/editor-classic/src/timeline/element-utils.ts";
	import { buildTextElement } from "/packages/editor-classic/src/timeline/element-utils.ts";
	import { buildElementFromMedia } from "/packages/editor-classic/src/timeline/element-utils.ts";
	import { CanvasRenderer } from "/packages/editor-classic/src/services/renderer/canvas-renderer.ts";
	import { WasmCompositor } from "/packages/editor-classic/src/services/renderer/compositor/wasm-compositor.ts";
	import { buildScene } from "/packages/editor-classic/src/services/renderer/scene-builder.ts";
	import { SceneExporter } from "/packages/editor-classic/src/services/renderer/scene-exporter.ts";

	const TICKS_PER_SECOND = 120_000;

	function round(value) {
		return Math.round(value * 10_000) / 10_000;
	}

	function videoElement(duration) {
		return {
			...buildElementFromMedia({
				mediaId: "compat-video",
				mediaType: "video",
				name: "Compatibility video",
				duration,
				startTime: 0,
			}),
			id: "compat-video-element",
			isSourceAudioEnabled: false,
		};
	}

	function textElement(duration) {
		const element = buildTextElement({
			raw: { duration, name: "Compatibility text" },
			startTime: 0,
		});
		return {
			...element,
			id: "compat-text-element",
			params: {
				...element.params,
				content: "ROCUT TEXT",
				fontFamily: "Arial",
				fontSize: 36,
				fontWeight: "bold",
				color: "#fef08a",
				"transform.positionY": -42,
			},
		};
	}

	function graphicElement(duration) {
		const element = buildGraphicElement({
			definitionId: "rectangle",
			name: "Compatibility graphic",
			startTime: 0,
			params: {
				fill: "#e11d48",
				stroke: "#f8fafc",
				strokeWidth: 8,
				cornerRadius: 24,
				"transform.positionX": -92,
				"transform.positionY": 42,
				"transform.scaleX": 0.46,
				"transform.scaleY": 0.28,
				opacity: 0.92,
			},
		});
		return { ...element, id: "compat-graphic-element", duration };
	}

	function scene(config) {
		const duration = config.duration;
		const mediaAsset = {
			id: "compat-video",
			name: "compatibility.mp4",
			type: "video",
			file: new File([Uint8Array.of(0, 0, 0, 0)], "compatibility.mp4", {
				type: "video/mp4",
			}),
			url: "blob:compatibility-video",
			duration: duration / TICKS_PER_SECOND,
			width: config.width,
			height: config.height,
		};
		return buildScene({
			canvasSize: { width: config.width, height: config.height },
			tracks: {
				main: {
					id: "main",
					name: "Video",
					type: "video",
					elements: [videoElement(duration)],
					muted: true,
					hidden: false,
				},
				overlay: [
					{
						id: "text-track",
						name: "Text",
						type: "text",
						elements: [textElement(duration)],
						hidden: false,
					},
					{
						id: "graphic-track",
						name: "Graphic",
						type: "graphic",
						elements: [graphicElement(duration)],
						hidden: false,
					},
				],
				audio: [],
			},
			mediaAssets: [mediaAsset],
			duration,
			background: { type: "color", color: "#020617" },
			isPreview: false,
			assetResolver: { resolve: ({ ref }) => ref.path },
		});
	}

	function createAudioBuffer(config) {
		const buffer = new AudioBuffer({
			length: config.audioSampleRate,
			numberOfChannels: 1,
			sampleRate: config.audioSampleRate,
		});
		const channel = buffer.getChannelData(0);
		for (let index = 0; index < channel.length; index += 1) {
			const envelope =
				Math.min(1, index / 960) * Math.min(1, (channel.length - index) / 960);
			channel[index] =
				Math.sin((index / config.audioSampleRate) * Math.PI * 2 * 440) *
				0.18 *
				envelope;
		}
		return buffer;
	}

	function videoFrame({ width, height, time }) {
		const canvas = new OffscreenCanvas(width, height);
		const context = canvas.getContext("2d");
		if (!context) throw new Error("Compatibility video has no 2D context");
		const phase = Math.max(0, Math.min(1, time));
		const gradient = context.createLinearGradient(0, 0, width, height);
		gradient.addColorStop(0, `hsl(${210 + phase * 70} 80% 24%)`);
		gradient.addColorStop(1, `hsl(${320 - phase * 90} 74% 36%)`);
		context.fillStyle = gradient;
		context.fillRect(0, 0, width, height);
		context.fillStyle = "rgba(255,255,255,0.24)";
		context.fillRect(Math.round(phase * (width - 48)), 0, 48, height);
		return canvas;
	}

	function pixelSummary(canvas) {
		const target = document.createElement("canvas");
		target.width = canvas.width;
		target.height = canvas.height;
		const context = target.getContext("2d", { willReadFrequently: true });
		if (!context) throw new Error("Compatibility readback has no 2D context");
		context.drawImage(canvas, 0, 0);
		const pixels = context.getImageData(0, 0, target.width, target.height).data;
		let hash = 2_166_136_261;
		let nonBlackPixels = 0;
		for (let index = 0; index < pixels.length; index += 4) {
			for (let channel = 0; channel < 4; channel += 1) {
				hash ^= pixels[index + channel];
				hash = Math.imul(hash, 16_777_619);
			}
			if (
				pixels[index] !== 0 ||
				pixels[index + 1] !== 0 ||
				pixels[index + 2] !== 0
			) {
				nonBlackPixels += 1;
			}
		}
		return {
			digest: (hash >>> 0).toString(16).padStart(8, "0"),
			nonBlackPixels,
		};
	}

	function containsAscii(buffer, value) {
		const bytes = new Uint8Array(buffer);
		const target = new TextEncoder().encode(value);
		outer: for (
			let index = 0;
			index <= bytes.length - target.length;
			index += 1
		) {
			for (let offset = 0; offset < target.length; offset += 1) {
				if (bytes[index + offset] !== target[offset]) continue outer;
			}
			return true;
		}
		return false;
	}

	async function sha256(buffer) {
		const digest = await crypto.subtle.digest("SHA-256", buffer);
		return [...new Uint8Array(digest)]
			.map((byte) => byte.toString(16).padStart(2, "0"))
			.join("");
	}

	globalThis.__probeNonMotionExport = async (config) => {
		await initializeGpu();
		const compositor = new WasmCompositor({
			trackGpuResource: ({ handle, label }) => ({
				handle,
				label,
				resourceId: `non-motion-export:${handle}`,
				release: () => disposeCompositor(handle),
			}),
		});
		const rootNode = scene(config);
		const requestedTimes = [];
		const videoCache = {
			getFrameAt: async ({ time }) => {
				requestedTimes.push(time);
				return {
					canvas: videoFrame({
						width: config.width,
						height: config.height,
						time,
					}),
				};
			},
		};
		try {
			const renderer = new CanvasRenderer({
				width: config.width,
				height: config.height,
				fps: config.fps,
				compositor,
				videoCache,
			});
			const samples = [];
			for (const time of config.sampleTimes) {
				samples.push({
					time,
					...(await renderer.renderAndCapture({
						node: rootNode,
						time,
						capture: pixelSummary,
					})),
				});
			}

			const exporter = new SceneExporter({
				width: config.width,
				height: config.height,
				fps: config.fps,
				format: "mp4",
				quality: "low",
				shouldIncludeAudio: true,
				audioBuffer: createAudioBuffer(config),
				compositor,
				videoCache,
			});
			let progressEvents = 0;
			let completeEvents = 0;
			let errorEvents = 0;
			exporter.on("progress", () => {
				progressEvents += 1;
			});
			exporter.on("complete", () => {
				completeEvents += 1;
			});
			exporter.on("error", () => {
				errorEvents += 1;
			});
			const startedAt = performance.now();
			const buffer = await exporter.export({
				rootNode,
				range: {
					startTime: 0,
					endTime: config.duration,
					duration: config.duration,
				},
			});
			if (!buffer) throw new Error("Non-motion export returned no buffer");
			const uniqueVideoTimes = new Set(requestedTimes);
			return {
				samples,
				video: {
					frameRequests: requestedTimes.length,
					distinctTimes: uniqueVideoTimes.size,
					minimumTime: Math.min(...requestedTimes),
					maximumTime: Math.max(...requestedTimes),
				},
				export: {
					frames: (config.duration / TICKS_PER_SECOND) * config.fps.numerator,
					progressEvents,
					completeEvents,
					errorEvents,
					elapsedMs: round(performance.now() - startedAt),
					bufferBytes: buffer.byteLength,
					fileType: String.fromCharCode(...new Uint8Array(buffer).slice(4, 8)),
					hasVideoHandler: containsAscii(buffer, "vide"),
					hasAudioHandler: containsAscii(buffer, "soun"),
					sha256: await sha256(buffer),
				},
			};
		} finally {
			compositor.dispose();
			disposeGpu();
		}
	};
</script>
