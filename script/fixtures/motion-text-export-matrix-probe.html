<!doctype html>
<meta charset="utf-8" />
<script type="module">
	import {
		createMotionTextPresetPreview as canonicalCreateMotionTextPresetPreview,
		disposeCompositor,
		disposeGpu,
		initializeGpu,
		mapMotionTextClipTime,
	} from "/rust/wasm/pkg/opencut_wasm.js";
	import { CanvasRenderer } from "/packages/editor-classic/src/services/renderer/canvas-renderer.ts";
	import { WasmCompositor } from "/packages/editor-classic/src/services/renderer/compositor/wasm-compositor.ts";
	import { buildScene } from "/packages/editor-classic/src/services/renderer/scene-builder.ts";
	import { SceneExporter } from "/packages/editor-classic/src/services/renderer/scene-exporter.ts";
	import { MotionTextFontRuntime } from "/packages/editor-classic/src/services/renderer/motion-text/font-runtime.ts";
	import { createMotionTextRenderRuntime } from "/packages/editor-classic/src/services/renderer/motion-text/jizura-adapter.ts";
	import { MOTION_TEXT_RENDERER_SUPPORT } from "/packages/editor-classic/src/services/renderer/motion-text/support-manifest.ts";
	import { createMotionTextPresetPreview } from "/packages/editor-classic/src/wasm/motion-text-factory.ts";

	const TICKS_PER_SECOND = 120_000;

	function round(value) {
		return Math.round(value * 10_000) / 10_000;
	}

	function tracksFor(sequence) {
		return {
			main: {
				id: "main",
				name: "Main",
				type: "video",
				elements: [],
				muted: false,
				hidden: false,
			},
			overlay: [
				{
					id: `motion-track:${sequence.id}`,
					name: "Motion text",
					type: "graphic",
					hidden: false,
					elements: [
						{
							id: `motion-clip:${sequence.id}`,
							name: "Motion text export matrix",
							type: "motion-text",
							sequenceId: sequence.id,
							startTime: 0,
							duration: sequence.duration,
							trimStart: 0,
							trimEnd: 0,
							params: {},
						},
					],
				},
			],
			audio: [],
		};
	}

	function buildExportScene(sequence, config, fontRuntime) {
		return buildScene({
			canvasSize: { width: config.width, height: config.height },
			tracks: tracksFor(sequence),
			mediaAssets: [],
			motionTextSequences: [sequence],
			motionTextTimeMapper: mapMotionTextClipTime,
			motionTextFontRuntime: fontRuntime,
			motionTextProjectId: "s09-export-matrix",
			duration: sequence.duration,
			background: { type: "color", color: "transparent" },
			isPreview: false,
			assetResolver: { resolve: ({ ref }) => ref.path },
		});
	}

	function createFontRuntime() {
		return new MotionTextFontRuntime({
			loadBuiltinFont: async ({ font }) => {
				const response = await fetch(`/apps/web/public/${font.builtinPath}`);
				if (!response.ok) {
					throw new Error(
						`Export-matrix font ${font.id} returned HTTP ${response.status}`,
					);
				}
				return response.arrayBuffer();
			},
			loadProjectFont: async () => null,
		});
	}

	function previewWindow({ group, runtime }) {
		const first = runtime.orderedCuts[0];
		if (!first) throw new Error("Preset preview has no renderable cuts");
		const transitionTicks = Math.max(
			1,
			Math.min(36_000, Math.floor(first.duration / 3)),
		);
		switch (group) {
			case "enter":
				return { startTime: first.startTime, duration: transitionTicks };
			case "hold":
				return {
					startTime: first.startTime + Math.floor(first.duration * 0.35),
					duration: Math.max(1, Math.floor(first.duration * 0.3)),
				};
			case "exit":
				return {
					startTime: first.startTime + first.duration - transitionTicks,
					duration: transitionTicks,
				};
			case "trans": {
				const second = runtime.orderedCuts[1];
				if (!second) {
					throw new Error("Transition preview has fewer than two cuts");
				}
				return {
					startTime: second.startTime,
					duration: Math.max(
						1,
						Math.min(36_000, Math.floor(second.duration / 3)),
					),
				};
			}
			default:
				return {
					startTime: first.startTime + Math.floor(first.duration * 0.2),
					duration: Math.max(1, Math.floor(first.duration * 0.6)),
				};
		}
	}

	function pixelSummary(canvas) {
		const target = document.createElement("canvas");
		target.width = canvas.width;
		target.height = canvas.height;
		const context = target.getContext("2d", { willReadFrequently: true });
		if (!context) throw new Error("Export-matrix readback has no 2D context");
		context.drawImage(canvas, 0, 0);
		const pixels = context.getImageData(0, 0, target.width, target.height).data;
		let hash = 2_166_136_261;
		let nonBlackPixels = 0;
		let nonTransparentPixels = 0;
		for (let index = 0; index < pixels.length; index += 4) {
			for (let channel = 0; channel < 4; channel += 1) {
				hash ^= pixels[index + channel];
				hash = Math.imul(hash, 16_777_619);
			}
			if (
				pixels[index] !== 0 ||
				pixels[index + 1] !== 0 ||
				pixels[index + 2] !== 0
			) {
				nonBlackPixels += 1;
			}
			if (pixels[index + 3] !== 0) nonTransparentPixels += 1;
		}
		return {
			digest: (hash >>> 0).toString(16).padStart(8, "0"),
			nonBlackPixels,
			nonTransparentPixels,
		};
	}

	async function sha256(value) {
		const bytes =
			typeof value === "string" ? new TextEncoder().encode(value) : value;
		const digest = await crypto.subtle.digest("SHA-256", bytes);
		return [...new Uint8Array(digest)]
			.map((byte) => byte.toString(16).padStart(2, "0"))
			.join("");
	}

	function mp4FileType(buffer) {
		const bytes = new Uint8Array(buffer);
		return String.fromCharCode(...bytes.slice(4, 8));
	}

	function createSequence(entry, config) {
		const created = createMotionTextPresetPreview({
			sequenceId: `s09-export:${entry.group}:${entry.id}`,
			previewText: config.previewText,
			language: "en",
			duration: config.duration,
			seed: config.seed,
			presetGroup: entry.group,
			presetId: entry.id,
			rendererSupport: MOTION_TEXT_RENDERER_SUPPORT,
			core: canonicalCreateMotionTextPresetPreview,
		});
		if (!created.sequence) {
			throw new Error(
				`${entry.group}:${entry.id} factory failed: ${JSON.stringify(created.diagnostics)}`,
			);
		}
		return { created, sequence: created.sequence };
	}

	async function runCase({ entry, config, compositor, fontRuntime }) {
		const { created, sequence } = createSequence(entry, config);
		const runtime = createMotionTextRenderRuntime({ sequence });
		const sampleWindow = previewWindow({ group: entry.group, runtime });
		const rootNode = buildExportScene(sequence, config, fontRuntime);
		const videoCache = { getFrameAt: async () => null };
		const renderer = new CanvasRenderer({
			width: config.width,
			height: config.height,
			fps: config.fps,
			compositor,
			videoCache,
		});
		const sampleTimes = config.samplePositions.map((position) =>
			Math.min(
				sampleWindow.startTime + sampleWindow.duration - 1,
				sampleWindow.startTime + Math.floor(sampleWindow.duration * position),
			),
		);
		const samples = [];
		for (const time of sampleTimes) {
			const pixels = await renderer.renderAndCapture({
				node: rootNode,
				time,
				capture: pixelSummary,
			});
			samples.push({ time, ...pixels });
		}
		const combinedSha256 = await sha256(
			samples
				.map(
					(sample) =>
						`${sample.time}:${sample.digest}:${sample.nonBlackPixels}:${sample.nonTransparentPixels}`,
				)
				.join("|"),
		);
		const ticksPerFrame = Math.round(
			(TICKS_PER_SECOND * config.fps.denominator) / config.fps.numerator,
		);
		let window = sampleWindow;
		if (Number.isInteger(config.exportFrameLimit)) {
			const duration = config.exportFrameLimit * ticksPerFrame;
			if (config.exportFrameLimit <= 0 || duration > sampleWindow.duration) {
				throw new Error(
					`${entry.group}:${entry.id} has an invalid export frame limit`,
				);
			}
			const bestSample = samples.reduce((best, sample) =>
				sample.nonBlackPixels > best.nonBlackPixels ? sample : best,
			);
			const startTime = Math.max(
				sampleWindow.startTime,
				Math.min(
					sampleWindow.startTime + sampleWindow.duration - duration,
					bestSample.time - Math.floor(duration / 2),
				),
			);
			window = { startTime, duration };
		}

		const exporter = new SceneExporter({
			width: config.width,
			height: config.height,
			fps: config.fps,
			format: "mp4",
			quality: "low",
			compositor,
			videoCache,
		});
		let progressEvents = 0;
		let completeEvents = 0;
		let errorEvents = 0;
		exporter.on("progress", () => {
			progressEvents += 1;
		});
		exporter.on("complete", () => {
			completeEvents += 1;
		});
		exporter.on("error", () => {
			errorEvents += 1;
		});
		const startedAt = performance.now();
		const buffer = await exporter.export({
			rootNode,
			range: {
				startTime: window.startTime,
				endTime: window.startTime + window.duration,
				duration: window.duration,
			},
		});
		const elapsedMs = performance.now() - startedAt;
		if (!buffer) {
			throw new Error(`${entry.group}:${entry.id} export returned no buffer`);
		}
		const cuts = sequence.resolvedPlan?.cuts ?? [];
		const appliedCutCount = cuts.filter((cut) => {
			const selected = cut.preset[entry.group];
			return Array.isArray(selected)
				? selected.includes(entry.id)
				: selected === entry.id;
		}).length;
		const eligibleCutCount =
			entry.group === "trans" ? Math.max(0, cuts.length - 1) : cuts.length;
		return {
			group: entry.group,
			id: entry.id,
			catalog: {
				name: entry.name,
				pack: entry.pack,
				sourceFile: entry.sourceFile,
			},
			factory: {
				diagnostics: created.diagnostics,
				cueCount: sequence.cues.length,
				cutCount: cuts.length,
				eligibleCutCount,
				appliedCutCount,
			},
			...(window === sampleWindow ? {} : { sampleWindow }),
			window,
			frames: { samples, combinedSha256 },
			export: {
				frames: Math.floor(window.duration / ticksPerFrame),
				progressEvents,
				completeEvents,
				errorEvents,
				elapsedMs: round(elapsedMs),
				bufferBytes: buffer.byteLength,
				fileType: mp4FileType(buffer),
				sha256: await sha256(buffer),
			},
		};
	}

	globalThis.__probeMotionTextExportMatrix = async ({ entries, config }) => {
		await initializeGpu();
		const compositor = new WasmCompositor({
			trackGpuResource: ({ handle, label }) => {
				let released = false;
				return {
					handle,
					label,
					resourceId: `s09-export-matrix:${handle}`,
					release: () => {
						if (released) return;
						released = true;
						disposeCompositor(handle);
					},
				};
			},
		});
		const fontRuntime = createFontRuntime();
		try {
			const results = [];
			for (const entry of entries) {
				results.push(await runCase({ entry, config, compositor, fontRuntime }));
				if (
					config.logProgress === true &&
					(results.length % 25 === 0 || results.length === entries.length)
				) {
					console.log(
						`motion-text export catalog ${results.length}/${entries.length}`,
					);
				}
			}
			return {
				results,
				fontRuntime: fontRuntime.inspect(),
				userAgent: navigator.userAgent,
			};
		} finally {
			compositor.dispose();
			disposeGpu();
			fontRuntime.dispose();
		}
	};
</script>
