	function digestPixels(pixels, width, height) {
		let hash = 0x811c9dc5;
		let nonTransparent = 0;
		let opaque = 0;
		let minX = width;
		let minY = height;
		let maxX = -1;
		let maxY = -1;
		for (let index = 0; index < pixels.length; index += 1) {
			hash ^= pixels[index];
			hash = Math.imul(hash, 0x01000193) >>> 0;
			if (index % 4 === 3) {
				if (pixels[index] > 0) {
					nonTransparent += 1;
					const pixelIndex = (index - 3) / 4;
					const x = pixelIndex % width;
					const y = Math.floor(pixelIndex / width);
					minX = Math.min(minX, x);
					minY = Math.min(minY, y);
					maxX = Math.max(maxX, x);
					maxY = Math.max(maxY, y);
				}
				if (pixels[index] === 255) opaque += 1;
			}
		}
		return {
			hash: hash.toString(16).padStart(8, "0"),
			nonTransparent,
			opaque,
			total: width * height,
			bounds:
				nonTransparent === 0
					? null
					: {
							x: minX,
							y: minY,
							width: maxX - minX + 1,
							height: maxY - minY + 1,
						},
		};
	}

	function digest(
		sequenceValue,
		sequenceTime,
		{ width = 320, height = 180 } = {},
	) {
		const frame = resolveMotionTextRenderFrame({
			runtime: createMotionTextRenderRuntime({ sequence: sequenceValue }),
			sequenceTime,
		});
		if (!frame) throw new Error("renderer browser fixture produced no frame");
		const canvas = document.createElement("canvas");
		canvas.width = width;
		canvas.height = height;
		const ctx = canvas.getContext("2d", { willReadFrequently: true });
		if (!ctx) throw new Error("renderer browser fixture has no 2d context");
		drawMotionTextFrame({
			ctx,
			frame,
			width: canvas.width,
			height: canvas.height,
			compositionMode: sequenceValue.compositionMode,
		});
		const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
		return digestPixels(pixels, canvas.width, canvas.height);
	}

	function digestOffscreen(
		sequenceValue,

		const ctx = canvas.getContext("2d", { willReadFrequently: true });

		drawMotionTextFrame({

			height: canvas.height,
			compositionMode: sequenceValue.compositionMode,
		});
		const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

	}

	function mapClipTime({
		clipStartTime,
		clipDuration,
		trimStart,
		timelineTime,
		sequenceDuration,
	}) {
		const sequenceTime = trimStart + timelineTime - clipStartTime;
		const active =
			timelineTime >= clipStartTime &&
			timelineTime < clipStartTime + clipDuration &&
			sequenceTime >= 0 &&
			sequenceTime < sequenceDuration;
		return { active, sequenceTime: active ? sequenceTime : null };
	}

			isPreview,

		});

	function captureDigest(canvas) {
		const target = document.createElement("canvas");
		target.width = canvas.width;
		target.height = canvas.height;
		const context = target.getContext("2d", { willReadFrequently: true });
		if (!context) throw new Error("compositor readback has no 2d context");
		context.drawImage(canvas, 0, 0);
		return digestPixels(
			context.getImageData(0, 0, target.width, target.height).data,
			target.width,
			target.height,
		);
	}

	async function renderPipeline(sequenceValue) {
		await initializeGpu();
		const compositor = new WasmCompositor({
			trackGpuResource: ({ handle, label }) => ({
				handle,
				label,
				resourceId: `probe:${handle}`,
				release: () => disposeCompositor(handle),
			}),
		});
		const rendererParams = {
			width: 320,
			height: 180,
			fps: { numerator: 30, denominator: 1 },
			compositor,
			videoCache: { getFrameAt: async () => null },
		};
		const previewRenderer = new CanvasRenderer(rendererParams);
		const exportRenderer = new CanvasRenderer(rendererParams);
		const previewScene = sceneFor(sequenceValue, true);
		const exportScene = sceneFor(sequenceValue, false);
		const renderAt = (renderer, node, time) =>
			renderer.renderAndCapture({ node, time, capture: captureDigest });
		try {
			const preview = await renderAt(previewRenderer, previewScene, 25_000);
			const exportFrame = await renderAt(exportRenderer, exportScene, 25_000);
			const later = await renderAt(previewRenderer, previewScene, 55_000);
			const repeated = await renderAt(previewRenderer, previewScene, 25_000);
			return { preview, export: exportFrame, later, repeated };
		} finally {
			compositor.dispose();
			disposeGpu();
		}
	}

	async function probeFontRuntime() {
		const response = await fetch(
			"/node_modules/next/dist/compiled/@vercel/og/Geist-Regular.ttf",
		);
		if (!response.ok) {
			throw new Error(`Geist font fixture returned HTTP ${response.status}`);
		}
		const bytes = await response.arrayBuffer();
		const inspection = inspectMotionTextFont({
			bytes: new Uint8Array(bytes),
			text: "Hello 世界",
			faceIndex: 0,
		});
		if (!inspection.inspection) {
			throw new Error(`Geist font fixture is invalid: ${inspection.error}`);
		}
		let loads = 0;
		const runtime = new MotionTextFontRuntime({
			loadBuiltinFont: async () => bytes.slice(0),
			loadProjectFont: async () => {
				loads += 1;
				return bytes.slice(0);
			},
		});
		const readySequence = sequenceWithProjectFont({
			id: "font-ready",
			text: "Hello motion",
			contentDigest: inspection.inspection.contentDigest,
		});
		const ready = await runtime.prepareSequence({
			projectId: "project:font-browser-probe",
			purpose: "preview",
			sequence: readySequence,
		});
		const family = ready.fonts.get("font:geist-fixture")?.family;
		if (!family)
			throw new Error("Font runtime did not publish the loaded face");
		const loadedBeforeInvalidate = loadedFaceCount(family);
		const missing = await runtime.prepareSequence({
			projectId: "project:font-browser-probe",
			purpose: "export",
			sequence: sequenceWithProjectFont({
				id: "font-missing-glyph",
				text: "Hello 世界",
				contentDigest: inspection.inspection.contentDigest,
			}),
		});
		runtime.invalidate();
		const loadedAfterInvalidate = loadedFaceCount(family);
		await runtime.prepareSequence({
			projectId: "project:font-browser-probe",
			purpose: "preview",
			sequence: readySequence,
		});
		const loadedAfterReload = loadedFaceCount(family);
		runtime.dispose();

		const builtinPath = "motion-text/fonts/noto-sans-jp-variable.ttf";
		const builtinResponse = await fetch(`/apps/web/public/${builtinPath}`);
		if (!builtinResponse.ok) {
			throw new Error(
				`JIZURA builtin font fixture returned HTTP ${builtinResponse.status}`,
			);
		}
		const builtinBytes = await builtinResponse.arrayBuffer();
		const builtinInspection = inspectMotionTextFont({
			bytes: new Uint8Array(builtinBytes),
			text: "OpenCut 歌詞日本語あア",
			faceIndex: 0,
		});
		if (!builtinInspection.inspection) {
			throw new Error(
				`JIZURA builtin font is invalid: ${builtinInspection.error}`,
			);
		}
		const builtinLoads = [];
		const builtinRuntime = new MotionTextFontRuntime({
			loadBuiltinFont: async ({ font }) => {
				builtinLoads.push(font.builtinPath);
				return builtinBytes.slice(0);
			},
			loadProjectFont: async () => null,
		});
		const builtinReady = await builtinRuntime.prepareSequence({
			projectId: "project:font-browser-probe",
			purpose: "export",
			sequence: sequenceWithBuiltinFont({
				id: "font-builtin",
				text: "OpenCut 歌詞日本語あア",
				contentDigest: builtinInspection.inspection.contentDigest,
			}),
		});
		const builtinFamily = builtinReady.fonts.get("gothic_bold")?.family;
		if (!builtinFamily) {
			throw new Error("Builtin font runtime did not publish the loaded face");
		}
		const builtinLoadedBeforeDispose = loadedFaceCount(builtinFamily);
		builtinRuntime.dispose();
		return {
			inspection: inspection.inspection,
			readyDiagnostics: ready.diagnostics,
			missingDiagnostics: missing.diagnostics,
			loadedBeforeInvalidate,
			loadedAfterInvalidate,
			loadedAfterReload,
			loadedAfterDispose: loadedFaceCount(family),
			loads,
			snapshot: runtime.inspect(),
			builtin: {
				digest: builtinInspection.inspection.contentDigest,
				diagnostics: builtinReady.diagnostics,
				loads: builtinLoads,
				loadedBeforeDispose: builtinLoadedBeforeDispose,
				loadedAfterDispose: loadedFaceCount(builtinFamily),
			},
		};
	}
