<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			/* Measurable 64px test target, using the existing graph-host marker palette. */
			html,
			body {
				margin: 0;
				background: transparent;
			}
			#root {
				width: 64px;
				height: 64px;
				background: #16213e;
				overflow: hidden;
			}
			#marker {
				position: relative;
				top: 24px;
				width: 16px;
				height: 16px;
				background: #e94560;
			}
		</style>
		<script src="gsap.js"></script>
	</head>
	<body>
		<div
			id="root"
			data-composition-id="root"
			data-start="0"
			data-duration="0.32"
			data-width="64"
			data-height="64"
		>
			<div id="marker"></div>
			<hf-audio-group
				id="voice"
				data-volume="0.5"
				data-fx-chain='{"version":1,"nodes":[{"type":"saturate","params":{"type":"tanh","threshold":-9,"output":-3,"oversample":1}}]}'
			></hf-audio-group>
			<audio
				id="a"
				src="tone.wav"
				data-audio-group="voice"
				data-start="0"
				data-duration="0.32"
				data-track-index="0"
				loop
				data-fx-chain='{"version":1,"nodes":[{"type":"gain","params":{"gain":6}}]}'
				data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.75},{"t":0.32,"v":0.75}]}]}'
			></audio>
			<audio
				id="b"
				src="tone.wav"
				data-audio-group="voice"
				data-start="0.08"
				data-duration="0.16"
				data-track-index="1"
				loop
				data-fx-chain='{"version":1,"nodes":[{"type":"saturate","params":{"type":"tanh","threshold":-12,"output":0,"oversample":1}}]}'
				data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.5},{"t":0.16,"v":0.5}]}]}'
			></audio>
			<audio
				id="muted-fallback"
				src="tone.wav"
				data-start="0"
				data-duration="0.32"
				data-track-index="2"
				loop
				muted
				data-volume="0.75"
			></audio>
		</div>
		<script>
			window.__timelines = {
				root: gsap
					.timeline({ paused: true })
					.to("#marker", { x: 32, duration: 0.32, ease: "none" }, 0),
			};
		</script>
	</body>
</html>
