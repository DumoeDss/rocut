<!doctype html>
<meta charset="utf-8" />
<script type="module">
	import {
		WasmRuntimeGpuResourceQuery,
		WasmRuntimeGraphicsQuery,
		createCompositor,
		disposeCompositor,
		disposeGpu,
		getCompositorCanvas,
		getCompositorCanvasForHandle,
		initCompositor,
		initializeGpu,
		resizeCompositorForHandle,
	} from "/rust/wasm/pkg/opencut_wasm.js";

	const assert = (condition, message) => {
		if (!condition) throw new Error(message);
	};
	const expectThrow = (action, text) => {
		try {
			action();
		} catch (error) {
			assert(String(error).includes(text), `expected "${text}" in ${error}`);
			return String(error);
		}
		throw new Error(`expected an error containing "${text}"`);
	};

	globalThis.__wasmRuntimeProbe = (async () => {
		const graphics = new WasmRuntimeGraphicsQuery();
		const resources = new WasmRuntimeGpuResourceQuery();
		assert(graphics.selectedBackend() === null, "backend must begin null");
		assert(
			graphics.concurrentCompositorInstances() === 0,
			"initial capacity must be zero",
		);
		assert(
			graphics.unavailableReason().length > 0,
			"initial reason must be non-empty",
		);
		assert(
			resources.liveHandles().length === 0,
			"initial handles must be empty",
		);

		await initializeGpu();
		const backend = graphics.selectedBackend();
		const capacity = graphics.concurrentCompositorInstances();
		assert(
			backend === "webgpu" || backend === "webgl",
			`invalid backend ${backend}`,
		);
		assert(
			capacity === (backend === "webgpu" ? 2 : 1),
			"capacity disagrees with backend",
		);
		assert(
			graphics.unavailableReason() === "",
			"selected backend must have no failure reason",
		);

		const handles = [];
		const canvases = [];
		for (let index = 0; index < capacity; index += 1) {
			const handle = createCompositor(64 + index, 48 + index);
			handles.push(handle);
			canvases.push(getCompositorCanvasForHandle(handle));
			resizeCompositorForHandle(handle, 80 + index, 60 + index);
		}
		assert(
			new Set(handles).size === capacity,
			"explicit handles must be distinct",
		);
		assert(
			JSON.stringify(resources.liveHandles()) === JSON.stringify(handles),
			"live handle enumeration must be ascending and complete",
		);
		if (capacity === 2)
			assert(canvases[0] !== canvases[1], "WebGPU canvases must be distinct");
		expectThrow(() => createCompositor(10, 10), "capacity");
		expectThrow(() => disposeGpu(), "handles are live");

		resources.release({ handle: handles[0] });
		resources.release({ handle: handles[0] });
		assert(
			!resources.liveHandles().includes(handles[0]),
			"double release must keep the named handle absent",
		);
		for (const handle of handles.slice(1)) disposeCompositor(handle);
		disposeGpu();
		assert(
			graphics.selectedBackend() === null,
			"teardown must restore null backend",
		);
		assert(
			graphics.concurrentCompositorInstances() === 0,
			"teardown capacity must be zero",
		);
		assert(
			graphics.unavailableReason().length > 0,
			"teardown reason must be non-empty",
		);

		await initializeGpu();
		initCompositor(32, 32);
		assert(
			resources.liveHandles()[0] === 0,
			"legacy compositor must own reserved handle zero",
		);
		assert(
			getCompositorCanvas() === getCompositorCanvasForHandle(0),
			"legacy canvas must delegate",
		);
		disposeCompositor(0);
		disposeCompositor(0);
		disposeGpu();
		return { backend, capacity, handles };
	})();
</script>
