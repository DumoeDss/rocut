<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<script src="gsap.js"></script>
	</head>
	<body>
		<div
			id="root"
			data-composition-id="root"
			data-start="0"
			data-duration="0.72"
			data-width="64"
			data-height="64"
		>
			<div id="marker"></div>
			<div
				id="outer"
				data-composition-id="outer"
				data-start="0.04"
				data-duration="0.56"
				data-track-index="0"
			>
				<div
					id="scene"
					data-composition-id="scene"
					data-probe-scene="first"
					data-start="0.04"
					data-duration="0.24"
					data-track-index="0"
				>
					<hf-audio-group id="voice" data-volume="0.5"></hf-audio-group>
					<audio
						id="track"
						data-probe-case="first-trim"
						src="tone.wav"
						data-audio-group="voice"
						data-start="0.02"
						data-duration="0.08"
						data-media-start="0.02"
						data-volume="0.25"
						data-track-index="0"
					></audio>
					<audio
						id="loop"
						data-probe-case="first-loop"
						src="tone.wav"
						loop
						data-audio-group="voice"
						data-start="0.02"
						data-duration="0.20"
						data-media-start="0.04"
						data-volume="0.125"
						data-track-index="1"
					></audio>
					<audio
						id="muted"
						data-probe-case="first-muted"
						src="tone.wav"
						muted
						data-audio-group="voice"
						data-start="0.04"
						data-duration="0.08"
						data-volume="1"
						data-track-index="2"
					></audio>
					<audio
						id="natural"
						data-probe-case="first-natural"
						src="tone.wav"
						data-audio-group="voice"
						data-start="0.12"
						data-media-start="0.02"
						data-playback-rate="2"
						data-track-index="3"
					></audio>
				</div>
				<div
					id="scene"
					data-composition-id="scene"
					data-probe-scene="second"
					data-start="0.28"
					data-duration="0.24"
					data-track-index="0"
				>
					<hf-audio-group id="voice" data-volume="0.75"></hf-audio-group>
					<audio
						id="track"
						data-probe-case="second-trim"
						src="tone.wav"
						data-audio-group="voice"
						data-start="0.02"
						data-duration="0.08"
						data-media-start="0.02"
						data-volume="0.25"
						data-track-index="0"
					></audio>
					<audio
						id="loop"
						data-probe-case="second-loop"
						src="tone.wav"
						loop
						data-audio-group="voice"
						data-start="0.02"
						data-duration="0.20"
						data-media-start="0.04"
						data-volume="0.125"
						data-track-index="1"
					></audio>
					<audio
						id="muted"
						data-probe-case="second-muted"
						src="tone.wav"
						muted
						data-audio-group="voice"
						data-start="0.04"
						data-duration="0.08"
						data-volume="1"
						data-track-index="2"
					></audio>
					<audio
						id="natural"
						data-probe-case="second-natural"
						src="tone.wav"
						data-audio-group="voice"
						data-start="0.12"
						data-media-start="0.02"
						data-playback-rate="2"
						data-track-index="3"
					></audio>
				</div>
			</div>
			<div data-hidden>
				<audio
					id="hidden"
					data-probe-case="hidden"
					src="tone.wav"
					data-start="0.60"
					data-duration="0.08"
					data-track-index="1"
				></audio>
			</div>
		</div>
		<script>
			window.__timelines = window.__timelines || {};
			window.__timelines.root = gsap
				.timeline({ paused: true })
				.to("#marker", { x: 32, duration: 0.72, ease: "none" }, 0);
			window.__timelines.outer = gsap.timeline({ paused: true });
			window.__timelines.scene = gsap.timeline({ paused: true });
		</script>
	</body>
</html>
