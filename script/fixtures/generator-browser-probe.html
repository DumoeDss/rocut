<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Rocut generators</title>
	</head>
	<body>
		<script type="module">
			import { runGeneratorProbe } from "./generator-browser-probe.ts";
			runGeneratorProbe()
				.then((result) => (globalThis.__stylizedResult = result))
				.catch((error) => {
					globalThis.__stylizedResult = {
						error: String(error),
						stack: error.stack,
					};
				});
		</script>
	</body>
</html>
