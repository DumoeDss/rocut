<!doctype html>
<html><head><style>
html,body { margin:0; background:transparent }
#root { position:relative; width:64px; height:64px }
#marker { position:absolute; top:0; width:8px; height:8px; background:#0000ff }
</style><script src="gsap.js"></script></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="0.32" data-width="64" data-height="64">
  <div id="marker"></div>
  <audio id="loop" src="tone.wav" loop data-start="0" data-duration="0.32" data-media-start="0.04" data-volume="0.25" data-track-index="0"></audio>
  <div id="scene" data-composition-id="scene" data-start="0.04" data-duration="0.16" data-track-index="1">
    <audio id="nested" src="tone.wav" data-start="0.04" data-duration="0.08" data-media-start="0.02" data-volume="0.5" data-track-index="2"></audio>
    <audio id="nested-loop" src="tone.wav" loop data-start="0.04" data-duration="0.32" data-media-start="0.04" data-volume="0.125" data-track-index="4"></audio>
  </div>
  <audio id="silent" src="tone.wav" muted data-start="0" data-duration="0.32" data-volume="1" data-track-index="3"></audio>
  <audio id="plain" src="tone.wav" data-start="0" data-duration="0.32" data-media-start="0.04" data-volume="0.0625" data-track-index="5"></audio>
</div>
<script>
window.__timelines = window.__timelines || {};
window.__timelines.root = gsap.timeline({paused:true}).to('#marker', {x:32, duration:0.32, ease:'none'}, 0);
window.__timelines.scene = gsap.timeline({paused:true});
</script></body></html>
