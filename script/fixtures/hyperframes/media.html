<!doctype html>
<html><head><style>
html,body { margin:0; background:transparent }
#root { position:relative; width:64px; height:64px }
#marker { position:absolute; top:56px; width:8px; height:8px; background:#0000ff }
#loop { position:absolute; top:32px; width:64px; height:32px }
</style><script src="gsap.js"></script></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="2" data-width="64" data-height="64">
  <div id="marker"></div>
  <video id="loop" src="assets/fast.webm" muted playsinline loop data-start="0" data-duration="2" data-track-index="0"></video>
  <div id="scene" data-composition-id="scene" data-composition-src="compositions/media-scene.html" data-start="0.1" data-duration="0.4" data-track-index="1"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
window.__timelines.root = gsap.timeline({paused:true}).to('#marker', {x:32, duration:2, ease:'none'}, 0);
</script></body></html>
