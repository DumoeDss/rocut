<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				margin: 0;
				background: transparent;
			}
			#root {
				width: 96px;
				height: 96px;
				background: rgb(20, 30, 70);
			}
		</style>
		<script src="gsap.js"></script>
	</head>
	<body>
		<div
			id="root"
			data-composition-id="root"
			data-start="0"
			data-duration="1"
			data-width="96"
			data-height="96"
		></div>
		<script>
			const timeline = gsap.timeline({ paused: true });
			for (let frame = 0; frame < 25; frame++)
				timeline.set(
					"#root",
					{ backgroundColor: `rgb(${20 + frame * 2},30,70)` },
					frame / 25,
				);
			window.__timelines = { root: timeline };
		</script>
	</body>
</html>
