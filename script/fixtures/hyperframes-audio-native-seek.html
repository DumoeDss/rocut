<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<script src="gsap.js"></script>
	</head>
	<body>
		<div
			id="root"
			data-composition-id="root"
			data-start="0"
			data-duration="0.32"
			data-width="64"
			data-height="64"
		>
			<div id="marker"></div>
			<audio
				id="subframe"
				src="tone.wav"
				data-start="0.101"
				data-duration="0.002"
				data-track-index="0"
				data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.25},{"t":0.002,"v":0.75}]}]}'
			></audio>
		</div>
		<script>
			window.__timelines = window.__timelines || {};
			window.__timelines.root = gsap
				.timeline({ paused: true })
				.to("#marker", { x: 32, duration: 0.32, ease: "none" }, 0);
		</script>
	</body>
</html>
