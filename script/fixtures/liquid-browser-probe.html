<!doctype html>
<meta charset="utf-8" />
<title>Liquid independent browser acceptance</title>
<script type="module">
	import { runLiquidProbe } from "./liquid-browser-probe.ts";
	runLiquidProbe()
		.then((result) => (globalThis.__liquidResult = result))
		.catch(
			(error) =>
				(globalThis.__liquidResult = {
					ok: false,
					error: String(error),
					stack: error.stack,
				}),
		);
</script>
