<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- Design E7: identical to the Content-Security-Policy response header
		     the scheme handler sets, carried in the artifact so the policy is
		     visible in the built HTML itself. Any relaxation names the feature
		     that forced it, in a comment here and in the evidence. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'"
		/>
		<link rel="icon" href="/favicon.ico" />
		<title>OpenCut editor — Electron host</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
