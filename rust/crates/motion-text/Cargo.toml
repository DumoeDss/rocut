[package]
name = "motion-text"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
bridge = { version = "0.1.0", path = "../bridge" }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
time = { version = "0.1.0", path = "../time" }
ttf-parser = "0.25.1"
tsify-next = { version = "0.5", optional = true }
wasm-bindgen = { version = "0.2.116", optional = true }

[features]
wasm = ["dep:wasm-bindgen", "dep:tsify-next", "tsify-next/js"]
